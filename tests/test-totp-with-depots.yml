name: Test Steam Deploy with TOTP and depot paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          username: test-builder
          totp: "123456"
          appId: "1234567"
          firstDepotIdOverride: "1234568"
          buildDescription: "Test build for CI"
          rootPath: "/tmp/builds"
          depot1Path: "/tmp/builds/depot1"
          depot2Path: "/tmp/builds/depot2"
          depot3Path: "/tmp/builds/depot3"
          depot4Path: "/tmp/builds/depot4"
          depot5Path: "/tmp/builds/depot5"
          depot6Path: "/tmp/builds/depot6"
          depot7Path: "/tmp/builds/depot7"
          depot8Path: "/tmp/builds/depot8"
          depot9Path: "/tmp/builds/depot9"
          releaseBranch: "beta"
      - name: Assert action ran (may fail due to missing Steam credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "This action requires real Steam credentials to succeed."
          echo "Input coverage test passed - all inputs were provided."
          echo "PASS"
