name: Test missing required username fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock game-ci CLI and steamcmd shims
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/mock-bin/setup.sh"
      - id: action
        uses: .
        continue-on-error: true
        with:
          username: ''
          password: builder-pass
          appId: '1000'
      - name: Assert action failed before invoking the CLI
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when username is empty"
            exit 1
          fi
          if [ -f /tmp/steam-deploy-mock/out/args.txt ]; then
            echo "FAIL: CLI should not have been invoked"
            exit 1
          fi
          echo "PASS"
