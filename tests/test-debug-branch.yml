name: Test debug branch input
on:
  workflow_dispatch:
jobs:
  test-debug-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with debugBranch enabled (expect failure at login)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: test-user
          appId: '1234567'
          depot1Path: 'build'
          debugBranch: 'true'
          totp: 'INVALID_TOTP'

      - name: Assert action failed at Steam login (not at input validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Steam credentials"
            exit 1
          fi
          echo "PASS: action correctly accepted debugBranch input and failed at Steam login"

  test-debug-branch-false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with debugBranch disabled (default false, expect failure at login)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: test-user
          appId: '1234567'
          depot1Path: 'build'
          debugBranch: 'false'
          totp: 'INVALID_TOTP'

      - name: Assert action failed at Steam login (not at input validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Steam credentials"
            exit 1
          fi
          echo "PASS: action correctly accepted debugBranch=false and failed at Steam login"
