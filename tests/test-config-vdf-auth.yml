name: Test configVdf authentication path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake base64-encoded configVdf
        id: prep
        run: |
          # Create a minimal fake config.vdf content and base64 encode it
          FAKE_VDF='BeginVDF\n"InstallConfigStore"\n{\n}\nEndVDF'
          ENCODED=$(echo -e "$FAKE_VDF" | base64 -w 0)
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - name: Run action with configVdf (expect failure at Steam login)
        id: action
        uses: .
        with:
          username: fake_user
          configVdf: ${{ steps.prep.outputs.encoded }}
          appId: '7654321'
          buildDescription: 'ConfigVdf auth test'
          rootPath: '.'
          depot1Path: 'depot1'
        continue-on-error: true

      - name: Assert action failed at Steam login (not at configVdf processing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real Steam credentials)"
            exit 1
          fi
          echo "PASS: action correctly processed configVdf and failed at Steam login"
