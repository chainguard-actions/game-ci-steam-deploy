name: Test TOTP and configVdf auth without password
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock game-ci CLI and steamcmd shims
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/mock-bin/setup.sh"
      - id: action
        uses: .
        with:
          username: builder-user
          totp: ABC12
          configVdf: ZmFrZS1jb25maWctdmRm
          appId: '480'
          depot1Path: game
      - name: Assert buildId output
        env:
          ACTUAL: ${{ steps.action.outputs.buildId }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "987654" ]; then
            echo "FAIL: expected buildId '987654'"
            exit 1
          fi
          echo "PASS"
      - name: Assert auth env and defaults
        run: |
          OUT=/tmp/steam-deploy-mock/out
          cat "$OUT/env.txt"
          cat "$OUT/args.txt"
          grep -qxF "STEAM_USERNAME=builder-user" "$OUT/env.txt" || { echo "FAIL: STEAM_USERNAME"; exit 1; }
          grep -qxF "STEAM_PASSWORD=<unset>" "$OUT/env.txt" || { echo "FAIL: STEAM_PASSWORD should be unset"; exit 1; }
          grep -qxF "STEAM_TOTP=ABC12" "$OUT/env.txt" || { echo "FAIL: STEAM_TOTP"; exit 1; }
          grep -qxF "STEAM_CONFIG_VDF_BASE64=ZmFrZS1jb25maWctdmRm" "$OUT/env.txt" || { echo "FAIL: configVdf must be passed through unchanged"; exit 1; }
          ARGS=" $(tr '\n' ' ' < "$OUT/args.txt")"
          case "$ARGS" in
            *" --depotId 481 "*) echo "ok: depotId defaults to appId+1" ;;
            *) echo "FAIL: expected --depotId 481"; exit 1 ;;
          esac
          if grep -qxF -- "--debugBranch" "$OUT/args.txt"; then
            echo "FAIL: --debugBranch should not be passed when debugBranch defaults to false"
            exit 1
          fi
          for secret in ABC12 ZmFrZS1jb25maWctdmRm; do
            if grep -qF -- "$secret" "$OUT/args.txt"; then
              echo "FAIL: secret '$secret' leaked into argv"
              exit 1
            fi
          done
          echo "PASS"
