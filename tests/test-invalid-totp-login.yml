name: Test invalid TOTP login failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with TOTP but invalid credentials (expect steamcmd login failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: invalid-test-user
          totp: '000000'
          appId: '1234567'
          buildDescription: 'Test build'
          rootPath: '.'
          depot1Path: 'build'
          releaseBranch: 'default'

      - name: Assert action failed at steamcmd login
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Steam credentials"
            exit 1
          fi
          echo "PASS: action correctly failed at steamcmd login with invalid credentials"
