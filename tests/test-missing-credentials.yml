name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: test-user
          appId: '1234567'
          depot1Path: 'build'

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when neither totp nor configVdf is provided"
            exit 1
          fi
          echo "PASS: action correctly failed with missing credentials"
