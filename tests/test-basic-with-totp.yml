name: Test basic usage with TOTP
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with TOTP (will fail at steamcmd login but should pass auth check)
        id: action
        uses: .
        with:
          username: fake-user
          totp: '123456'
          appId: '12345'
          buildDescription: 'Test build'
          rootPath: '.'
          depot1Path: 'build'
          releaseBranch: 'beta'
        continue-on-error: true
      - name: Assert action failed at steamcmd (not at auth check)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because steamcmd login will fail with fake credentials,
          # but it should NOT fail with "Config VDF input is missing or incomplete!"
          # (that would mean the auth check failed, not the steamcmd step).
          # Either way, the action is expected to fail (no real Steam credentials).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real Steam credentials), but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (steamcmd login with fake credentials)"
