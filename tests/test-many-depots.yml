name: Test many depots (depot3-9 coverage)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        continue-on-error: true
        with:
          username: test-user
          totp: "000000"
          appId: "1234567"
          buildDescription: "Test build with many depots"
          rootPath: "/tmp/build"
          depot1Path: "/tmp/build/depot1"
          depot2Path: "/tmp/build/depot2"
          depot3Path: "/tmp/build/depot3"
          depot3InstallScriptPath: "/tmp/build/depot3/install.vdf"
          depot4Path: "/tmp/build/depot4"
          depot4InstallScriptPath: "/tmp/build/depot4/install.vdf"
          depot5Path: "/tmp/build/depot5"
          depot5InstallScriptPath: "/tmp/build/depot5/install.vdf"
          depot6Path: "/tmp/build/depot6"
          depot6InstallScriptPath: "/tmp/build/depot6/install.vdf"
          depot7Path: "/tmp/build/depot7"
          depot7InstallScriptPath: "/tmp/build/depot7/install.vdf"
          depot8Path: "/tmp/build/depot8"
          depot8InstallScriptPath: "/tmp/build/depot8/install.vdf"
          depot9Path: "/tmp/build/depot9"
          depot9InstallScriptPath: "/tmp/build/depot9/install.vdf"
          releaseBranch: "beta"
      - name: Assert action ran (expected to fail at Steam login with invalid TOTP)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because the TOTP/credentials are invalid.
          # We only need to verify that the action was invoked (not skipped) and
          # that it failed at the Steam authentication stage, not before processing inputs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run (and fail at login)"
            exit 1
          fi
          echo "PASS: action ran with depot3-9 inputs (failed at Steam login as expected)"
