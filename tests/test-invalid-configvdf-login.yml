name: Test invalid configVdf login failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake base64-encoded configVdf
        id: fake-config
        run: |
          # Create a minimal fake config.vdf content and base64-encode it
          FAKE_VDF='BeginVdf\n"InstallConfigStore"\n{\n}\nEndVdf'
          ENCODED=$(echo -e "$FAKE_VDF" | base64 -w 0)
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - name: Run action with configVdf but invalid credentials (expect steamcmd login failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: invalid-test-user
          configVdf: ${{ steps.fake-config.outputs.encoded }}
          appId: '9999999'
          buildDescription: 'Test build with configVdf'
          rootPath: '.'
          depot1Path: 'build'

      - name: Assert action failed at steamcmd login
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Steam credentials via configVdf"
            exit 1
          fi
          echo "PASS: action correctly failed at steamcmd login when using configVdf path"
