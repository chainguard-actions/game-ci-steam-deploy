name: Test depot with install script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with depot install script path
        id: action
        uses: .
        continue-on-error: true
        with:
          username: fake-user
          totp: '000000'
          appId: '1111111'
          buildDescription: 'Install script test'
          rootPath: '.'
          depot1Path: 'build/windows'
          depot1InstallScriptPath: 'install_scripts/windows_install.vdf'
          depot2Path: 'build/linux'
          depot2InstallScriptPath: 'install_scripts/linux_install.vdf'

      - name: Assert action failed at Steam login (not at install script configuration)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (Steam login with fake credentials should fail)"
            exit 1
          fi
          echo "PASS: action processed depot install scripts, failed at Steam login as expected"
