name: Test with TOTP reaches Steam login step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fake TOTP (expect failure at Steam login, not at auth check)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: fake-user
          totp: '123456'
          appId: '1234567'
          buildDescription: 'Test build'
          rootPath: '.'
          depot1Path: 'build'
          releaseBranch: 'beta'

      - name: Assert action failed (Steam login will fail with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (Steam login with fake credentials should fail)"
            exit 1
          fi
          echo "PASS: action correctly failed at Steam login step (not at auth validation)"
