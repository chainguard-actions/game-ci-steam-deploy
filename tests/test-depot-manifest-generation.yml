name: Test depot manifest generation with depot paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with depot paths (expect failure at login, not manifest generation)
        id: action
        uses: .
        with:
          username: fake_user
          totp: '123456'
          appId: '9999999'
          buildDescription: 'Test build'
          rootPath: '.'
          depot1Path: 'build/linux'
          depot2Path: 'build/windows'
          releaseBranch: 'beta'
        continue-on-error: true

      - name: Assert action failed at login step (not at manifest generation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because the Steam credentials are fake,
          # but it should get past the manifest generation phase.
          # Any failure outcome here is expected since we cannot provide real Steam credentials.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake Steam credentials"
            exit 1
          fi
          echo "PASS: action correctly failed at Steam login (not at manifest generation)"
