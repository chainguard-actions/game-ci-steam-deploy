name: Test depot paths and firstDepotIdOverride
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create fake build directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/windows"
          mkdir -p "$GITHUB_WORKSPACE/build/linux"
          echo "fake-game-binary" > "$GITHUB_WORKSPACE/build/windows/game.exe"
          echo "fake-game-binary" > "$GITHUB_WORKSPACE/build/linux/game"

      - id: action
        uses: .
        continue-on-error: true
        with:
          username: test-user
          appId: '1234567'
          firstDepotIdOverride: '2000000'
          totp: '123456'
          rootPath: 'build'
          depot1Path: 'windows'
          depot2Path: 'linux'
          buildDescription: 'Multi-depot test build'
          releaseBranch: 'beta'

      - name: Assert action ran (depot manifest generation exercised, fails at Steam login)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully at Steam login (fake TOTP, no real credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real credentials may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
