name: Test invalid TOTP causes login failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with invalid TOTP (expect login failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: 'invalid_test_user_xyz'
          totp: '000000'
          appId: '1234567'
          buildDescription: 'Test build'
          releaseBranch: 'default'
          depot1Path: 'build'

      - name: Assert action failed at login step
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Steam credentials"
            exit 1
          fi
          echo "PASS: action correctly failed at Steam login with invalid credentials"
