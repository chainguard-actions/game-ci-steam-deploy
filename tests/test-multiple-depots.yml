name: Test multiple depots configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with multiple depots and firstDepotIdOverride
        id: action
        uses: .
        continue-on-error: true
        with:
          username: fake-user
          totp: '000000'
          appId: '9999999'
          firstDepotIdOverride: '10000000'
          buildDescription: 'Multi-depot test build'
          rootPath: '.'
          depot1Path: 'build/windows'
          depot2Path: 'build/linux'
          depot3Path: 'build/mac'
          releaseBranch: 'default'

      - name: Assert action failed at Steam login (not at depot configuration)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (Steam login with fake credentials should fail)"
            exit 1
          fi
          echo "PASS: action processed multiple depots and firstDepotIdOverride, failed at Steam login as expected"
