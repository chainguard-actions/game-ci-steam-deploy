name: Test missing auth error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action expecting failure (no totp or configVdf)
        id: action
        uses: .
        with:
          username: fake-user
          appId: '12345'
          depot1Path: 'build'
        continue-on-error: true
      - name: Assert action failed with missing auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when neither totp nor configVdf is provided, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when auth credentials were missing"
