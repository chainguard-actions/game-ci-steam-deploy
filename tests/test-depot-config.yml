name: Test depot configuration with firstDepotIdOverride
on:
  workflow_dispatch:
jobs:
  test-depot-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with depot config and firstDepotIdOverride (expect failure at login)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: test-user
          appId: '1000000'
          firstDepotIdOverride: '2000001'
          buildDescription: 'Test build'
          rootPath: 'build'
          depot1Path: 'build/windows'
          depot2Path: 'build/linux'
          releaseBranch: 'beta'
          totp: 'INVALID_TOTP'

      - name: Assert action failed (expected - invalid credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed at Steam login with invalid credentials"
