name: Test firstDepotIdOverride input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with firstDepotIdOverride and TOTP (expect steamcmd login failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: invalid-test-user
          totp: '000000'
          appId: '1234567'
          firstDepotIdOverride: '2000000'
          buildDescription: 'Test build with depot override'
          rootPath: '.'
          depot1Path: 'build'
          depot2Path: 'build2'
          releaseBranch: 'beta'
          debugBranch: 'false'

      - name: Assert action failed at steamcmd login (not at depot config)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Steam credentials"
            exit 1
          fi
          echo "PASS: action correctly processed depot override and failed at steamcmd login"
