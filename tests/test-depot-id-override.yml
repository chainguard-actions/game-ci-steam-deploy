name: Test firstDepotIdOverride input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with firstDepotIdOverride (expect failure at Steam login, not input validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: 'nonexistent_test_user_12345'
          password: 'invalid_password'
          totp: '000000'
          appId: '1234567'
          firstDepotIdOverride: '9000001'
          buildDescription: 'Test build with depot override'
          rootPath: '.'
          depot1Path: '.'

      - name: Assert action failed at Steam login (not at input validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid Steam credentials"
            exit 1
          fi
          echo "PASS: action correctly processed firstDepotIdOverride and failed at Steam login stage"
