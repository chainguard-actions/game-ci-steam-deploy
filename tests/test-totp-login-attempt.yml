name: Test TOTP login attempt (invalid credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with totp but invalid credentials (expect failure at login)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: fake-user
          totp: '123456'
          appId: '1234567'
          buildDescription: 'Test build'
          rootPath: '.'
          depot1Path: '.'

      - name: Assert action failed at Steam login (not at configVdf validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because Steam login with fake credentials fails,
          # NOT because of missing configVdf. Both outcomes result in failure,
          # but the important thing is the action ran past the configVdf check.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (Steam login with fake credentials should fail)"
            exit 1
          fi
          echo "PASS: action failed as expected (Steam login with invalid credentials)"
