name: Test firstDepotIdOverride input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with firstDepotIdOverride (expect failure at login)
        id: action
        uses: .
        with:
          username: fake_user
          totp: '000000'
          appId: '1000000'
          firstDepotIdOverride: '2000001'
          buildDescription: 'Override depot ID test'
          rootPath: '.'
          depot1Path: 'build'
        continue-on-error: true

      - name: Assert action failed at Steam login (not at input processing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because the Steam credentials are fake.
          # If it fails here, it means it processed the firstDepotIdOverride input
          # and got past manifest generation to the login step.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake Steam credentials"
            exit 1
          fi
          echo "PASS: action correctly processed firstDepotIdOverride and failed at Steam login"
