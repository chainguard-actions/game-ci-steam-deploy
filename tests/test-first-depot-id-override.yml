name: Test firstDepotIdOverride input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with firstDepotIdOverride and invalid TOTP
        id: action
        uses: .
        continue-on-error: true
        with:
          username: 'invalid_test_user_xyz'
          totp: '000000'
          appId: '1234567'
          firstDepotIdOverride: '9999001'
          buildDescription: 'Test build with depot override'
          depot1Path: 'build'
          depot2Path: 'build2'

      - name: Assert action failed at login (not at manifest generation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail at Steam login, not at manifest generation.
          # If it fails at manifest generation, the firstDepotIdOverride logic is broken.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Steam credentials"
            exit 1
          fi
          echo "PASS: action correctly processed firstDepotIdOverride and failed at Steam login"
