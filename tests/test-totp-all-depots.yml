name: Test Steam Deploy - TOTP auth with all depot paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          username: test-builder
          totp: "123456"
          appId: "1234567"
          firstDepotIdOverride: "1234568"
          buildDescription: "Test build description"
          rootPath: "/tmp/builds"
          depot1Path: "/tmp/builds/depot1"
          depot2Path: "/tmp/builds/depot2"
          depot3Path: "/tmp/builds/depot3"
          depot4Path: "/tmp/builds/depot4"
          depot5Path: "/tmp/builds/depot5"
          depot6Path: "/tmp/builds/depot6"
          depot7Path: "/tmp/builds/depot7"
          depot8Path: "/tmp/builds/depot8"
          depot9Path: "/tmp/builds/depot9"
          releaseBranch: "beta"
      - name: Verify action was invoked
        run: |
          echo "Action completed (with or without error - Steam credentials not available in test)"
          echo "All inputs were passed successfully to the action"
          echo "PASS"
