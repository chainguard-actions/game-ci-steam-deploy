name: Test action fails when the CLI deployment fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock game-ci CLI and steamcmd shims
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/mock-bin/setup.sh"
      - id: action
        uses: .
        continue-on-error: true
        env:
          FAKE_GAME_CI_FAIL: '1'
        with:
          username: builder-user
          password: builder-pass
          appId: '1000'
          depot1Path: build
      - name: Assert failure, no buildId and cleanup
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUILD_ID: ${{ steps.action.outputs.buildId }}
        run: |
          echo "outcome: $OUTCOME"
          echo "buildId: $BUILD_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail when the CLI exits non-zero"
            exit 1
          fi
          if [ -n "$BUILD_ID" ]; then
            echo "FAIL: buildId should be empty on failure"
            exit 1
          fi
          OUT=/tmp/steam-deploy-mock/out
          if [ ! -f "$OUT/args.txt" ]; then
            echo "FAIL: fake CLI was never invoked"
            exit 1
          fi
          STEAM_HOME="$(sed -n 's/^STEAM_HOME=//p' "$OUT/env.txt")"
          ROOT="$(dirname "$(dirname "$STEAM_HOME")")"
          echo "steamcmd root: $ROOT"
          if [ -e "$ROOT" ]; then
            echo "FAIL: steamcmd root was not removed after failure"
            exit 1
          fi
          echo "PASS"
