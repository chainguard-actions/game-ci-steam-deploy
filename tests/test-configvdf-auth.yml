name: Test Steam Deploy with configVdf authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          username: test-builder
          configVdf: "fake-config-vdf-content-for-testing"
          appId: "1234567"
          buildDescription: "Test build using configVdf auth"
          rootPath: "/tmp/builds"
          depot1Path: "/tmp/builds/depot1"
          releaseBranch: "default"
      - name: Assert action ran (may fail due to missing Steam credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "This action requires real Steam credentials to succeed."
          echo "Input coverage test passed - configVdf input was provided."
          echo "PASS"
