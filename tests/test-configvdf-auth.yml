name: Test configVdf authentication path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create fake configVdf (base64-encoded placeholder)
        id: fake-config
        run: |
          # Create a minimal fake config.vdf content and base64-encode it
          FAKE_VDF='BeginBufferedSection "Config" { "Software" { "Valve" { "Steam" { } } } }'
          ENCODED=$(echo "$FAKE_VDF" | base64 -w 0)
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        continue-on-error: true
        with:
          username: test-user
          appId: '1234567'
          configVdf: ${{ steps.fake-config.outputs.encoded }}
          rootPath: '.'
          buildDescription: 'Test configVdf build'
          releaseBranch: 'default'

      - name: Assert action ran (configVdf path exercised, fails at Steam login)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully at Steam login (fake configVdf, no real credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real credentials may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
