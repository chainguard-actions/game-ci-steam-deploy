name: Test configVdf auth path
on:
  workflow_dispatch:
jobs:
  test-configvdf-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake base64-encoded configVdf
        id: fake-config
        run: |
          # Create a minimal fake config.vdf content and base64 encode it
          FAKE_VDF='{"config": "fake"}'
          ENCODED=$(echo "$FAKE_VDF" | base64 -w 0)
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - name: Run action with configVdf (expect failure at Steam login, not at configVdf validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          username: test-user
          password: fake-password
          configVdf: ${{ steps.fake-config.outputs.encoded }}
          appId: '1234567'
          depot1Path: 'build'
          buildDescription: 'Test configVdf path'

      - name: Assert action failed at Steam login (not at configVdf validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail (at Steam login with fake credentials)
          # but NOT at the configVdf validation step
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake Steam credentials"
            exit 1
          fi
          echo "PASS: action correctly proceeded past configVdf validation and failed at Steam login"
