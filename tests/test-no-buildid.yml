name: Test success without a BuildID leaves the output empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock game-ci CLI and steamcmd shims
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/mock-bin/setup.sh"
      - id: action
        uses: .
        env:
          FAKE_GAME_CI_NO_BUILDID: '1'
        with:
          username: builder-user
          password: builder-pass
          appId: '1000'
      - name: Assert buildId is empty
        env:
          ACTUAL: ${{ steps.action.outputs.buildId }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty buildId"
            exit 1
          fi
          OUT=/tmp/steam-deploy-mock/out
          cat "$OUT/args.txt"
          if grep -qxF -- "--depotPath" "$OUT/args.txt"; then
            echo "FAIL: --depotPath should not be passed when depot1Path is unset"
            exit 1
          fi
          echo "PASS"
