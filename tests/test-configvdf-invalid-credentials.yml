name: Test configVdf path with invalid credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a fake base64-encoded configVdf
        id: fake-config
        run: |
          # Create a minimal fake config.vdf content and base64-encode it
          FAKE_VDF='"InstallConfigStore"\n{\n  "Software"\n  {\n    "Valve"\n    {\n      "Steam"\n      {\n      }\n    }\n  }\n}'
          ENCODED=$(printf '%s' "$FAKE_VDF" | base64 -w 0)
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - name: Run action with configVdf but invalid credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          username: 'invalid_test_user_xyz'
          configVdf: ${{ steps.fake-config.outputs.encoded }}
          appId: '1234567'
          buildDescription: 'Test build'
          depot1Path: 'build'

      - name: Assert action failed at login step
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid Steam credentials via configVdf"
            exit 1
          fi
          echo "PASS: action correctly failed at Steam login when using configVdf with invalid credentials"
